                    a.innerHTML = `<img src="${post.imageUrl}" alt="${post.title}" class="w-16 h-16 rounded-lg object-cover mr-4"><div class="overflow-hidden"><h5 class="font-semibold text-gray-800 leading-tight truncate">${post.title}</h5><p class="text-sm text-gray-500">${new Date(post.date).toLocaleDateString('vi-VN')}</p></div>`;
                    postList.appendChild(a);
                });
            }
        });
    </script>

</body>

</html>
