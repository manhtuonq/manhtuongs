<body class="min-h-screen flex items-center justify-center p-4">
    <div class="login-container w-full max-w-md p-8">
        <div class="text-center mb-8">

            <p class="text-gray-600">Đăng nhập để sử dụng dịch vụ</p>
        </div>

        <!-- Tab Navigation -->
        <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
            <button id="loginTab" class="tab-button flex-1 py-2 px-4 rounded-md text-sm font-medium text-gray-600 active">

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">

            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-lg text-white font-semibold">

            </button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Họ tên</label>
                <input type="text" class="form-input w-full px-4 py-3 rounded-lg" placeholder="Nhập họ tên" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" class="form-input w-full px-4 py-3 rounded-lg" placeholder="Nhập email" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
                <input type="password" class="form-input w-full px-4 py-3 rounded-lg" placeholder="Nhập mật khẩu" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Xác nhận mật khẩu</label>
                <input type="password" class="form-input w-full px-4 py-3 rounded-lg" placeholder="Nhập lại mật khẩu" required>
            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-lg text-white font-semibold">
                Đăng ký
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-gray-600 hover:text-gray-800 text-sm">
                <i class="fas fa-arrow-left mr-2"></i>Quay về trang chủ
            </a>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-8 max-w-md mx-4 text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                <i class="fas fa-check text-green-600 text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">Đăng nhập thành công!</h3>
            <p class="text-gray-600 mb-6">Quý khách chỉ được sử dụng <span class="font-bold text-red-600">3 lần đăng Đặc Tả Design</span> / tháng!</p>
            <button onclick="goToManagement()" class="btn-primary px-6 py-3 rounded-lg text-white font-semibold">
                OK - Chuyển đến quản lý
            </button>
        </div>
    </div>

    <script>
        // Tab switching
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // Cookie management functions
        function setCookie(name, value, days = 365) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = name + '=' + encodeURIComponent(JSON.stringify(value)) + ';expires=' + expires.toUTCString() + ';path=/';
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    try {
                        return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length)));
                    } catch (e) {
                        return c.substring(nameEQ.length, c.length);
                    }
                }
            }
            return null;
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;
            
            // Save user data to cookie
            const userData = {
                name: 'Chào mừng trở lại!',
                email: email,
                postsThisMonth: 2,
                totalPosts: 2,
                balance: 2500000,
                recentPosts: [
                    {
                        id: '001',
                        title: 'Website Bánh Tráng',
                        date: '2 ngày trước',
                        status: 'completed'
                    },
                    {
                        id: '002',
                        title: 'Website Xe Điện',
                        date: '5 ngày trước',
                        status: 'processing'
                    }
                ]
            };
            
            setCookie('userData', userData);
            showSuccessModal();
        });

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = e.target.querySelectorAll('input[type="text"]')[0].value;
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelectorAll('input[type="password"]')[0].value;
            
            // Save user data to cookie
            const userData = {
                name: name,
                email: email,
                postsThisMonth: 0,
                totalPosts: 0,
                balance: 2500000,
                recentPosts: []
            };
            
            setCookie('userData', userData);
            showSuccessModal();
        });

        function showSuccessModal() {
            document.getElementById('successModal').classList.remove('hidden');
        }

        function goToManagement() {
            window.location.href = '/design/management.html';
        }
    </script>
